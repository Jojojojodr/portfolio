name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: portfolio-linux-amd64
            binary: portfolio-linux-amd64
            archive: tar.gz

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            name: portfolio-linux-arm64
            binary: portfolio-linux-arm64
            archive: tar.gz

          - os: windows-latest
            goos: windows
            goarch: amd64
            name: portfolio-windows-amd64
            binary: portfolio-windows-amd64
            archive: zip

          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: portfolio-darwin-amd64
            binary: portfolio-darwin-amd64
            archive: tar.gz

          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: portfolio-darwin-arm64
            binary: portfolio-darwin-arm64
            archive: tar.gz
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: |
          npm i
          go mod download
          go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate Go code for templates
        run: templ generate

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./static/css/input.css -o ./static/css/style.css --minify

      - name: Create release package
        run: |
          mkdir -p release/database
          cp -r static release/static
          cp -r database/seeds release/database/seeds
          cp config.example.yaml release/config.yaml
          cp .github/docs/RELEASE.md release/README.md

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o release/${{ matrix.binary }}-${{ github.ref_name }} ./cmd/main.go

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:CGO_ENABLED=1
          $env:GOOS="${{ matrix.goos }}"
          $env:GOARCH="${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o release/${{ matrix.binary }}-${{ github.ref_name }}.exe ./cmd/main.go

      - name: Create archive
        shell: bash
        run: |
          cd release
          if [[ "${{ matrix.goos }}" == "windows" && "${{ matrix.archive }}" == "zip" ]]; then
            pwsh -Command "Compress-Archive -Path * -DestinationPath ../${{ matrix.name }}.zip"
          elif [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf ../${{ matrix.name }}.tar.gz .
          else
            zip -r ../${{ matrix.name }}.zip .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            - Automated release for ${{ github.ref_name }}
            
            ## Downloads
            Choose the archive for your platform:
            - **Linux**: portfolio-linux-amd64.tar.gz (native build with SQLite support)
            - **Linux (ARM)**: portfolio-linux-arm64.tar.gz (native build with SQLite support)
            - **Windows**: portfolio-windows-amd64.zip (native build with SQLite support)  
            - **macOS (Intel)**: portfolio-darwin-amd64.tar.gz (native build with SQLite support)
            - **macOS (Apple Silicon)**: portfolio-darwin-arm64.tar.gz (native build with SQLite support)
            
            ## Features
            - **All platforms**: Native compilation with full SQLite support
            - **CGO enabled**: Maximum performance and compatibility
            - **Platform optimized**: Built on native runners for best results
            
            ## Usage
            1. Download the appropriate archive for your platform.
            2. Extract the archive to your desired location.
            3. Run the binary from the extracted folder.

            executable can be run directly from the command line. For example:
            ```bash
            ./portfolio-linux-arm64 -p 8080 -d sqlite -t your_secret_token

            # For Windows:
            portfolio-windows-amd64.exe -p 8080 -d sqlite -t your_secret_token

            ```
            
            ## What's included
            - Natively compiled binary with all dependencies
            - Static assets (CSS, images, etc.)
            - Frontend templates
            - Database seeds
            - Default configuration
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
