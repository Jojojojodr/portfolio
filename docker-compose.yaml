services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: portfolio-app
    # Must match server.port / server.admin_port in the config file
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      # Config file from the host, database.type in it selects sqlite or postgres
      - ./config.yaml:/app/config.yaml:ro
      # SQLite database file, used when database.type is "sqlite" (path: "./data/sqlite.db")
      - ./data/:/app/data/
    restart: unless-stopped
    networks:
      - portfolio-network

  postgres:
    image: postgres:latest
    container_name: portfolio-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: your_db_username
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: your_db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_db_username -d your_db_name"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge
