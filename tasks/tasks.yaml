version: '3'

tasks:
  watch-css:
    cmds:
      - echo "Watching CSS changes"
      - npx tailwindcss -i ./static/css/input.css -o ./static/css/style.css --watch
    silent: true

  build-css:
    cmds:
      - echo "Building CSS"
      - npx tailwindcss -i ./static/css/input.css -o ./static/css/style.css --minify
    silent: true

  air:
    cmds:
      - air -c .air_{{ OS }}.toml
    silent: true