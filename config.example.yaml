server:
  host: "localhost"
  port: 8080
  jwt_secret: "your_jwt_secret_key"
database:
  type: "sqlite"
  path: "./database/sqlite.db"
  host: "localhost"
  port: 5432
  username: "your_db_username"
  password: "your_db_password"
  name: "your_db_name"
  ssl_mode: "disable"
gin:
  mode: "debug"
  trusted_proxies: ["127.0.0.1"]
  