version: '3'

includes:
  os_specific: ./tasks/taskfile_{{ OS }}.yaml
  css: ./tasks/css.yaml
  dev: ./tasks/dev.yaml
  docker: ./tasks/docker.yaml

vars:
  BIN: ./bin/
  TMP: ./tmp/
  GO_PATH: ./cmd/main.go

tasks:
  default:
    cmds:
      - echo "Running the application"
      - task: css:build-css
      - templ generate
      - go run {{ .GO_PATH }}
    silent: true

  serve:
    deps:
      - task: css:watch-css
      - task: dev:air
    silent: true

  build:
    cmds:
      - templ generate
      - task: css:build-css
      - go build -o {{ .BIN }}{{ .EXECUTABLE }} {{ .GO_PATH }}
      - mkdir -p {{ .BIN }}database
      - '[ -e {{ .BIN }}static ] || cp -r ./static {{ .BIN }}static'
      - '[ -e {{ .BIN }}database/seeds ] || cp -r ./database/seeds {{ .BIN }}database/seeds'
      - '[ -e {{ .BIN }}config.yaml ] || cp ./config.example.yaml {{ .BIN }}config.yaml'
      - echo "Application build"
    silent: true

  run:
    deps:
      - task: build
    cmds:
      - echo "Building and running the application"
      - cd {{ .BIN }} && exec ./{{ .EXECUTABLE }}
    silent: true

  clean:
    cmds:
      - echo "Cleaning application"
      - rm -rf {{ .BIN }}
      - rm -rf {{ .TMP }}
    silent: true
