version: '3'

dotenv:
  - .env

includes:
  os_specific: ./tasks/taskfile_{{ OS }}.yaml
  tasks: ./tasks/tasks.yaml

vars:
  GO_RUN_PATH: ./cmd/main.go

tasks:
  default:
    cmds:
      - echo "Running the application"
      - templ generate
      - go run {{ .GO_RUN_PATH }}
    silent: true
  
  serve:
    deps:
      - task: tasks:watch-css
      - task: tasks:air
    silent: true

  build:
    cmds:
      - templ generate
      - task: tasks:build-css
      - go build -o {{ .EXE_PATH }} {{ .GO_RUN_PATH }}
      - cp -r ./static ./bin/static
      - cp -r ./database/seeds ./bin/database/seeds
      - cp ./config.example.yaml ./bin/config.yaml
      - echo "Application build"
    silent: true

  run:
    deps:
      - task: build
    cmds:
      - echo "Building and running the application"
      - ./{{ .EXE_PATH }}
    silent: true

  docker:
    cmds:
      - docker-compose up -d
      - echo "Docker containers started"
    silent: true

  docker-stop:
    cmds:
      - docker-compose down
      - echo "Docker containers stopped"
    silent: true

  docker-build:
    cmds:
      - echo "Building Docker containers"
      - templ generate
      - task: tasks:build-css
      - docker-compose up --build
    silent: true
  
  docker-rebuild:
    cmds:
      - echo "Rebuilding Docker containers"
      - docker-compose down
      - templ generate
      - task: tasks:build-css
      - docker-compose up --build --force-recreate
    silent: true

  clean:
    cmds:
      - echo "Cleaning application"
      - rm -rf ./bin
      - rm -rf ./tmp
    silent: true
